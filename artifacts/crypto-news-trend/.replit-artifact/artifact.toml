kind = "web"
previewPath = "/"
title = "CryptoNewsTrend"
version = "1.0.0"
id = "artifacts/crypto-news-trend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21868

[services.development]
run = "pnpm --filter @workspace/crypto-news-trend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crypto-news-trend", "run", "build" ]
publicDir = "artifacts/crypto-news-trend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21868"
BASE_PATH = "/"
